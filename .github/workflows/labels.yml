name: 🏷️ Sync labels

# Keep the repo's issue/PR labels in sync with .github/labels.yml
on:
  push:
    branches: [main]
    paths:
      - ".github/labels.yml"
      - ".github/workflows/labels.yml"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  labels:
    name: 🎨  Apply labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ⬇️  Checkout
        uses: actions/checkout@v7

      - name: 🏷️  Sync
        uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          # keep any labels not listed here (don't nuke GitHub defaults)
          delete-other-labels: false
          token: ${{ secrets.GITHUB_TOKEN }}
