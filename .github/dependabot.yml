version: 2
updates:
  # Site dependencies (Astro / Vue / Tailwind …)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "web"]
    commit-message:
      prefix: "deps"

  # GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"

  # Rust / WASM mini-apps
  - package-ecosystem: cargo
    directory: "/projects/horizon"
    schedule:
      interval: weekly
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "deps(horizon)"
  - package-ecosystem: cargo
    directory: "/projects/justcode"
    schedule:
      interval: weekly
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "deps(justcode)"
  - package-ecosystem: cargo
    directory: "/projects/terminal"
    schedule:
      interval: weekly
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "deps(terminal)"
