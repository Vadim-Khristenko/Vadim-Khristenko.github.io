  <script>
    window.tlang = function () {
      var l = (navigator.language || "en").toLowerCase();
      if (l.indexOf("ru") === 0) return "ru";
      if (l.indexOf("zh") === 0) return "zh";
      return "en";
    };
    // tiny persistence bridge (localStorage, namespaced)
    window.sget = function (k) { try { return localStorage.getItem("vaiterm." + k) || ""; } catch (e) { return ""; } };
    window.sset = function (k, v) { try { localStorage.setItem("vaiterm." + k, v); } catch (e) {} };
  </script>
