  <!-- Highlighting + rasterization libs (loaded before wasm so the glue is ready) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
  <script>
    // Thin JS bridge — Rust calls these three globals.
    (function () {
      function esc(s) {
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      window.jcHighlight = function (code, lang) {
        try {
          if (window.hljs && lang && lang !== "plain" && window.hljs.getLanguage(lang)) {
            return window.hljs.highlight(code, { language: lang, ignoreIllegals: true }).value;
          }
          if (window.hljs) return window.hljs.highlightAuto(code).value;
        } catch (e) {}
        return esc(code);
      };
      function download(dataUrl, name, ext) {
        var a = document.createElement("a");
        a.download = name.replace(/[^\w.-]+/g, "_") + "." + ext;
        a.href = dataUrl;
        document.body.appendChild(a);
        a.click();
        a.remove();
      }
      window.jcExport = function (scale, filename, format) {
        var node = document.getElementById("jc-card");
        if (!node || !window.htmlToImage) return;
        var name = filename && filename.length ? filename : "justcode";
        var opt = { pixelRatio: scale || 2, cacheBust: true };
        var lib = window.htmlToImage;
        if (format === "jpeg") {
          lib.toJpeg(node, Object.assign({ quality: 0.96, backgroundColor: "#ffffff" }, opt))
            .then(function (u) { download(u, name, "jpg"); }).catch(err);
        } else if (format === "svg") {
          lib.toSvg(node, opt).then(function (u) { download(u, name, "svg"); }).catch(err);
        } else if (format === "webp") {
          lib.toCanvas(node, opt).then(function (c) { download(c.toDataURL("image/webp", 0.96), name, "webp"); }).catch(err);
        } else {
          lib.toPng(node, opt).then(function (u) { download(u, name, "png"); }).catch(err);
        }
        function err(e) { console.error("jcExport failed", e); }
      };
      window.jcCopyPng = function (scale) {
        var node = document.getElementById("jc-card");
        if (!node || !window.htmlToImage) return;
        if (!navigator.clipboard || !window.ClipboardItem) {
          console.warn("Clipboard image API unavailable — use Export instead.");
          return;
        }
        var opt = { pixelRatio: scale || 2, cacheBust: true };
        // Pass a Promise<Blob> to ClipboardItem so the write stays inside the
        // user gesture (required by Safari; works in Chromium/Firefox too).
        try {
          var item = new ClipboardItem({
            "image/png": window.htmlToImage.toBlob(node, opt).then(function (b) { return b; }),
          });
          navigator.clipboard.write([item]).catch(function (e) {
            console.error("copy image failed", e);
          });
        } catch (e) {
          window.htmlToImage.toBlob(node, opt).then(function (blob) {
            if (!blob) return;
            navigator.clipboard.write([new ClipboardItem({ "image/png": blob })])
              .catch(function (er) { console.error("copy image failed", er); });
          });
        }
      };
      window.jcCopyText = function (text) {
        if (navigator.clipboard) navigator.clipboard.writeText(text).catch(function () {});
      };
      window.jcLang = function () {
        var l = (navigator.language || "en").toLowerCase();
        if (l.indexOf("ru") === 0) return "ru";
        if (l.indexOf("zh") === 0) return "zh";
        return "en";
      };
      // preset persistence (localStorage, namespaced)
      window.jcGet = function (k) { try { return localStorage.getItem("justcode." + k) || ""; } catch (e) { return ""; } };
      window.jcSet = function (k, v) { try { localStorage.setItem("justcode." + k, v); } catch (e) {} };
    })();
  </script>
