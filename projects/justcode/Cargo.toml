[package]
name = "justcode"
version = "0.2.0"
edition = "2024"
authors = ["Vadim Khristenko <business@vai-rice.space>"]
description = "JustCode 2027 — turn code into beautiful screenshots (Rust + Leptos + WASM)"

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
