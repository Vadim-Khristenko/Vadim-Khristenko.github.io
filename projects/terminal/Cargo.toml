[package]
name = "vai-terminal"
version = "0.1.0"
edition = "2024"
authors = ["Vadim Khristenko <business@vai-rice.space>"]
description = "VAI Terminal — an interactive command-line portfolio (Rust + Leptos + WASM)"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
